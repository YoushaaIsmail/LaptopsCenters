{% extends 'base1.html'%}
{% load static%}

{% block content%}
<!--------main-content------------->
		   
		   <div class="main-content">
			  <div class="row">
			    
				<div class="col-md-12">
				<div class="table-wrapper">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
          <h2 class="ml-lg-2">Manage Center</h2>
        </div>
        <div class="col-sm-6 p-0 d-flex justify-content-lg-end justify-content-center">

          <!-- <a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal">
		  <i class="material-icons">&#xE15C;</i> <span>Delete</span></a> -->
        </div>
      </div>
    </div>
    <div class="modal-dialog">
      <div class="modal-content">
        <form  method="post" enctype="multipart/form-data">
          {% csrf_token %} 
          <div class="modal-header">
            <h4 class="modal-title">Edit About</h4>
            
          </div>

          <div class="modal-body">
            <div class="form-group">
           
              <label>Photo   <img src="{{about.photo.url}}" style="width:60px; height: 60px; border-radius:20%;"/>
							
              </label>
              <input type="file" name="Img">
            </div>

                        <div class="form-group">
           
              <label>  
                License Image 
                {% if about.photo1 %}
               
                <img src="{{about.photo1.url}}" style="width:60px; height: 60px; border-radius:20%;"/>
							  {% endif %}
              </label>
              <input type="file" name="Img1">
            </div>
            
            

            <div class="form-group">
              <label>UserName</label>
              <input type="text" class="form-control" name="UserName" value="{{user.username}}" required>
            </div>

            <div class="form-group">
              <label>Name</label>
              <input type="text" class="form-control" name="Name" value="{{about.name}}" required>
            </div>




            <div class="form-group">
              <label>Description</label>
              <textarea class="form-control" name="Description" required>{{about.Des}}</textarea>
            </div>

            <div class="form-group">
              <label>Address</label>
              <input type="text" class="form-control" name="Address" value="{{about.Address}}" required>
            </div>
      <div class="form-group">
              <label>Pricetrans</label>
              <input type="text" class="form-control" name="pricetrans" value="{{about.pricetrans}}" required>
            </div>
            <div class="form-group">
              <label>X</label>
              <input type="text" class="form-control" name="X" value="{{about.x}}" required>
            </div>

            <div class="form-group">
              <label>Y</label>
              <input type="text" class="form-control" name="Y" value="{{about.y}}" required>
            </div>
                        <div class="form-group">
              <label>PaymentInfo</label>
              <textarea class="form-control" name="PaymentInfo" required>{{about.PaymentInfo}}</textarea>
            </div>
          </div>
          <div class="modal-footer">
            <input type="submit" class="btn btn-success" value="Submit">
          </div>
        </form>
      </div>
    </div>

  </div>
</div>




				
		   
			  </div>
	 
			 
			 <!---footer---->
			 
			 
		</div>
		
		<footer class="footer">
			    <div class="container-fluid">
				  <div class="footer-in">
                    <p class="mb-0">**TEKCOMPUTER**</p>
                </div>
				</div>
			 </footer>
</div>
</div>

{% endblock %}
