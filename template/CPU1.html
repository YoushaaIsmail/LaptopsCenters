{% extends 'base1.html'%}
{% load static%}

{% block content%}
<!--------main-content------------->
		   
		   <div class="main-content">
			  <div class="row">
			    
				<div class="col-md-12">
				<div class="table-wrapper">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
          <h2 class="ml-lg-2">Manage CPU</h2>
        </div>
        <div class="col-sm-6 p-0 d-flex justify-content-lg-end justify-content-center">

          <!-- <a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal">
		  <i class="material-icons">&#xE15C;</i> <span>Delete</span></a> -->
        </div>
      </div>
    </div>
    <div class="modal-dialog">
      <div class="modal-content">
        <form  method="post" enctype="multipart/form-data">
          {% csrf_token %} 
          <div class="modal-header">
            <h4 class="modal-title">Edit CPU</h4>
            
          </div>

          <div class="modal-body">
            
            <div class="form-group">
              <label>name</label>
              <input type="text" class="form-control" name="name" value="{{CPU.name}}" required>
            </div>
            <div class="form-group">
              <label>price</label>
              <input type="text" class="form-control" name="price" value="{{CPU.price}}" required>
            </div>
            <div class="form-group">
              <label>count</label>
              <input type="text" class="form-control" name="count" value="{{CPU.count}}" required>
            </div>
            <div class="form-group">
              <label>link</label>
              <input type="text" class="form-control" name="link" value="{{CPU.link}}" required>
            </div>
            <div class="form-group">
              <label>socket_type</label>
              <input type="text" class="form-control" name="socket_type" value="{{CPU.socket_type}}" required>
            </div>
            <div class="form-group">
              <label>supported_ram_type</label>
              <input type="text" class="form-control" name="supported_ram_type" value="{{CPU.supported_ram_type}}" required>
            </div>
            <div class="form-group">
              <label>max_ram_speed</label>
              <input type="text" class="form-control" name="max_ram_speed" value="{{CPU.max_ram_speed}}" required>
            </div>
            <div class="form-group">
              <label>tdp</label>
              <input type="text" class="form-control" name="tdp" value="{{CPU.tdp}}" required>
            </div>
            <div class="form-group">
              <label>chipset</label>
              <input type="text" class="form-control" name="chipset" value="{{CPU.chipset}}" required>
            </div>


            <div class="form-group">
              <label>type</label>
              <select name="type">
                <option value="{{CPU.type}}">{{CPU.type}}</option>
                <option value="Low">Low</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
              </select>
            </div>
            
          </div>
          <div class="modal-footer">
            <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
            <input type="submit" class="btn btn-success" value="Edite">
          </div>
        </form>
      </div>
    </div>

  </div>
</div>




				
		   
			  </div>
	 
			 
			 <!---footer---->
			 
			 
		</div>
		
		<footer class="footer">
			    <div class="container-fluid">
				  <div class="footer-in">
                    <p class="mb-0">**TIKCOMPUTER**</p>
                </div>
				</div>
			 </footer>
</div>
</div>

{% endblock %}
