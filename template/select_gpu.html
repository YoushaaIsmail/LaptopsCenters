<!DOCTYPE html>
<html>
<head>
    <title>Select GPU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #b2ceeb !important;">
<div class="container mt-5">
    <h2 class="mb-4">Select GPU</h2>

    <form method="post">
        {% csrf_token %}
        <div class="row">
            {% for gpu in gpus %}
                <div class="col-md-4">
                    <div class="card mb-3 shadow-sm">
                        <div class="card-body">
                        <a href="{{gpu.link}}">    <h5 class="card-title">{{ gpu.name }}</h5></a>
                            <p class="card-text">
                                Type: {{ gpu.get_type_display }}<br>
                                PCIe: {{ gpu.interface_version }}<br>
                                Power Draw: {{ gpu.power_draw }}W<br>
                                Length: {{ gpu.length_mm }} mm<br>
                                Output Ports: {{ gpu.output_ports }}
                            </p>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gpu" value="{{ gpu.id }}" id="gpu{{ gpu.id }}" required>
                                <label class="form-check-label" for="gpu{{ gpu.id }}">
                                    Choose this GPU
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Next</button>
    </form>
</div>
</body>
</html>
