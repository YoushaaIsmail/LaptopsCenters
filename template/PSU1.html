{% extends 'base1.html'%}
{% load static%}

{% block content%}
<!--------main-content------------->
		   
		   <div class="main-content">
			  <div class="row">
			    
				<div class="col-md-12">
				<div class="table-wrapper">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
          <h2 class="ml-lg-2">Manage PSU</h2>
        </div>
        <div class="col-sm-6 p-0 d-flex justify-content-lg-end justify-content-center">

          <!-- <a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal">
		  <i class="material-icons">&#xE15C;</i> <span>Delete</span></a> -->
        </div>
      </div>
    </div>
    <div class="modal-dialog">
      <div class="modal-content">
        <form  method="post" enctype="multipart/form-data">
          {% csrf_token %} 
          <div class="modal-header">
            <h4 class="modal-title">Edit PSU</h4>
            
          </div>

          <div class="modal-body">
            
            <div class="form-group">
              <label>name</label>
              <input type="text" class="form-control" name="name" value="{{PSU.name}}" required>
            </div>
            <div class="form-group">
              <label>price</label>
              <input type="text" class="form-control" name="price" value="{{PSU.price}}" required>
            </div>
            <div class="form-group">
              <label>count</label>
              <input type="text" class="form-control" name="count" value="{{PSU.count}}" required>
            </div>
            <div class="form-group">
              <label>link</label>
              <input type="text" class="form-control" name="link" value="{{PSU.link}}" required>
            </div>
            <div class="form-group">
              <label>wattage</label>
              <input type="text" class="form-control" name="wattage" value="{{PSU.wattage}}" required>
            </div>
            <div class="form-group">
              <label>efficiency_rating</label>
              <input type="text" class="form-control" name="efficiency_rating" value="{{PSU.efficiency_rating}}" required>
            </div>
            <div class="form-group">
              <label>pcie_connectors</label>
              <input type="text" class="form-control" name="pcie_connectors" value="{{PSU.pcie_connectors}}" required>
            </div>
            <div class="form-group">
              <label>eps_connector</label>
              <input type="text" class="form-control" name="eps_connector" value="{{PSU.eps_connector}}" required>
            </div>
            <div class="form-group">
              <label>form_factor</label>
              <input type="text" class="form-control" name="form_factor" value="{{PSU.form_factor}}" required>
            </div>




            
          </div>
          <div class="modal-footer">
            <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
            <input type="submit" class="btn btn-success" value="Edite">
          </div>
        </form>
      </div>
    </div>

  </div>
</div>




				
		   
			  </div>
	 
			 
			 <!---footer---->
			 
			 
		</div>
		
		<footer class="footer">
			    <div class="container-fluid">
				  <div class="footer-in">
                    <p class="mb-0">**TIKCOMPUTER**</p>
                </div>
				</div>
			 </footer>
</div>
</div>

{% endblock %}
