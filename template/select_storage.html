<!DOCTYPE html>
<html>
<head>
    <title>Select Storage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #b2ceeb !important;">
<div class="container mt-5">
    <h2 class="mb-4">Select Storage</h2>

    <form method="post">
        {% csrf_token %}
        <div class="row">
            {% for storage in storages %}
                <div class="col-md-4">
                    <div class="card mb-3 shadow-sm">
                        <div class="card-body">
                         <a href="{{storage.link}}">  <h5 class="card-title">{{ storage.name }}</h5></a>
                            <p class="card-text">
                                Type: {{ storage.type }}<br>
                                Capacity: {{ storage.capacity }} GB
                            </p>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="storage" value="{{ storage.id }}" id="storage{{ storage.id }}" required>
                                <label class="form-check-label" for="storage{{ storage.id }}">
                                    Choose this Storage
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Next</button>
    </form>
</div>
</body>
</html>
