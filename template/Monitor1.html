{% extends 'base1.html'%}
{% load static%}

{% block content%}
<!--------main-content------------->
		   
		   <div class="main-content">
			  <div class="row">
			    
				<div class="col-md-12">
				<div class="table-wrapper">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
          <h2 class="ml-lg-2">Manage Monitor</h2>
        </div>
        <div class="col-sm-6 p-0 d-flex justify-content-lg-end justify-content-center">

          <!-- <a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal">
		  <i class="material-icons">&#xE15C;</i> <span>Delete</span></a> -->
        </div>
      </div>
    </div>
    <div class="modal-dialog">
      <div class="modal-content">
        <form  method="post" enctype="multipart/form-data">
          {% csrf_token %} 
          <div class="modal-header">
            <h4 class="modal-title">Edit Monitor</h4>
            
          </div>

          <div class="modal-body">
            
            <div class="form-group">
              <label>name</label>
              <input type="text" class="form-control" name="name" value="{{Monitor.name}}" required>
            </div>
            <div class="form-group">
              <label>count</label>
              <input type="text" class="form-control" name="count" value="{{Monitor.count}}" required>
            </div>
            <div class="form-group">
              <label>resolution</label>
              <input type="text" class="form-control" name="resolution" value="{{Monitor.resolution}}" required>
            </div>
            <div class="form-group">
              <label>refresh_rate</label>
              <input type="text" class="form-control" name="refresh_rate" value="{{Monitor.refresh_rate}}" required>
            </div>
            <div class="form-group">
              <label>panel_type</label>
              <input type="text" class="form-control" name="panel_type" value="{{Monitor.panel_type}}" required>
            </div>
            <div class="form-group">
              <label>input_ports</label>
              <input type="text" class="form-control" name="input_ports" value="{{Monitor.input_ports}}" required>
            </div>




            
          </div>
          <div class="modal-footer">
            <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
            <input type="submit" class="btn btn-success" value="Edite">
          </div>
        </form>
      </div>
    </div>

  </div>
</div>




				
		   
			  </div>
	 
			 
			 <!---footer---->
			 
			 
		</div>
		
		<footer class="footer">
			    <div class="container-fluid">
				  <div class="footer-in">
                    <p class="mb-0">**TIKCOMPUTER**</p>
                </div>
				</div>
			 </footer>
</div>
</div>

{% endblock %}
