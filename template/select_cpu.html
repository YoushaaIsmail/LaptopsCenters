<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select CPU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #b2ceeb !important;">
<div class="container mt-5">
    <h2 class="mb-4 text-center">Select CPU</h2>

    <form method="POST">
        {% csrf_token %}
        <div class="row">
            {% for cpu in cpus %}
                <div class="col-md-4">
                    <div class="card mb-4 shadow-sm">
                        <div class="card-body">
               <a href="{{cpu.link}}"><h5 class="card-title">{{ cpu.name }}</h5></a>
                            <p class="card-text">
                                Socket: {{ cpu.socket_type }}<br>
                                RAM Type: {{ cpu.supported_ram_type }}<br>
                                Type: {{ cpu.get_type_display }}<br>
                                TDP: {{ cpu.tdp }}W
                            </p>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="cpu" value="{{ cpu.id }}" id="cpu{{ cpu.id }}" required>
                                <label class="form-check-label" for="cpu{{ cpu.id }}">
                                    Choose this CPU
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Next</button>
    </form>
</div>
</body>
</html>
