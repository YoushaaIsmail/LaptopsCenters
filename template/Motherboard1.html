{% extends 'base1.html'%}
{% load static%}

{% block content%}
<!--------main-content------------->
		   
		   <div class="main-content">
			  <div class="row">
			    
				<div class="col-md-12">
				<div class="table-wrapper">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
          <h2 class="ml-lg-2">Manage Motherboard</h2>
        </div>
        <div class="col-sm-6 p-0 d-flex justify-content-lg-end justify-content-center">

          <!-- <a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal">
		  <i class="material-icons">&#xE15C;</i> <span>Delete</span></a> -->
        </div>
      </div>
    </div>
    <div class="modal-dialog">
      <div class="modal-content">
        <form  method="post" enctype="multipart/form-data">
          {% csrf_token %} 
          <div class="modal-header">
            <h4 class="modal-title">Edit Motherboard</h4>
            
          </div>

          <div class="modal-body">
            
            <div class="form-group">
              <label>name</label>
              <input type="text" class="form-control" name="name" value="{{Motherboard.name}}" required>
            </div>
            <div class="form-group">
              <label>price</label>
              <input type="text" class="form-control" name="price" value="{{Motherboard.price}}" required>
            </div>
            <div class="form-group">
              <label>count</label>
              <input type="text" class="form-control" name="count" value="{{Motherboard.count}}" required>
            </div>
            <div class="form-group">
              <label>link</label>
              <input type="text" class="form-control" name="link" value="{{Motherboard.link}}" required>
            </div>
            <div class="form-group">
              <label>socket_type</label>
              <input type="text" class="form-control" name="socket_type" value="{{Motherboard.socket_type}}" required>
            </div>
            <div class="form-group">
              <label>chipset</label>
              <input type="text" class="form-control" name="chipset" value="{{Motherboard.chipset}}" required>
            </div>
            <div class="form-group">
              <label>supported_ram_type</label>
              <input type="text" class="form-control" name="supported_ram_type" value="{{Motherboard.max_ram_speed}}" required>
            </div>
            <div class="form-group">
              <label>max_ram_speed</label>
              <input type="text" class="form-control" name="max_ram_speed" value="{{Motherboard.max_ram_speed}}" required>
            </div>
            <div class="form-group">
              <label>ram_slots</label>
              <input type="text" class="form-control" name="ram_slots" value="{{Motherboard.ram_slots}}" required>
            </div>
            <div class="form-group">
              <label>pcie_version</label>
              <input type="text" class="form-control" name="pcie_version" value="{{Motherboard.pcie_version}}" required>
            </div>
            <div class="form-group">
              <label>m2_slots</label>
              <input type="text" class="form-control" name="m2_slots" value="{{Motherboard.m2_slots}}" required>
            </div>
            <div class="form-group">
              <label>sata_ports</label>
              <input type="text" class="form-control" name="sata_ports" value="{{Motherboard.sata_ports}}" required>
            </div>            
          </div>
          <div class="modal-footer">
            <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
            <input type="submit" class="btn btn-success" value="Edite">
          </div>
        </form>
      </div>
    </div>

  </div>
</div>




				
		   
			  </div>
	 
			 
			 <!---footer---->
			 
			 
		</div>
		
		<footer class="footer">
			    <div class="container-fluid">
				  <div class="footer-in">
                    <p class="mb-0">**TIKCOMPUTER**</p>
                </div>
				</div>
			 </footer>
</div>
</div>

{% endblock %}
