{% extends 'base1.html' %}
{% load static %}

{% block content %}
<!-- Main content -->
<div class="main-content">
  <div class="row">
    <div class="col-md-12">
      <div class="table-wrapper">
        <div class="table-title">
          <div class="row">
            <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
              <h2 class="ml-lg-2">Edit Laptop</h2>
            </div>
          </div>
        </div>

        <div class="modal-dialog">
          <div class="modal-content">
            <form method="post" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="modal-header">
                <h4 class="modal-title">Edit Laptop</h4>
              </div>

              <div class="modal-body">

                <div class="form-group">
                  <label>Photo</label>
                  <input type="file" class="form-control" name="photo">
                </div>

                <div class="form-group">
                  <label>Name</label>
                  <input type="text" class="form-control" name="name" value="{{ laptop.name }}" required>
                </div>

                <div class="form-group">
                  <label>Count</label>
                  <input type="text" class="form-control" name="count" value="{{ laptop.count }}" required>
                </div>

                <div class="form-group">
                  <label>Type</label>
                  <input type="text" class="form-control" name="type" value="{{ laptop.type }}" required>
                </div>

                <div class="form-group">
                  <label>CPU</label>
                  <input type="text" class="form-control" name="CPU" value="{{ laptop.CPU }}" required>
                </div>
                <div class="form-group">
                  <label>CPU Link</label>
                  <input type="text" class="form-control" name="CPULink" value="{{ laptop.CPULink }}">
                </div>

                <div class="form-group">
                  <label>GPU</label>
                  <input type="text" class="form-control" name="GPU" value="{{ laptop.GPU }}" required>
                </div>
                <div class="form-group">
                  <label>GPU Link</label>
                  <input type="text" class="form-control" name="GPULink" value="{{ laptop.GPULink }}">
                </div>

                <div class="form-group">
                  <label>Monitor</label>
                  <input type="text" class="form-control" name="Monitor" value="{{ laptop.Monitor }}">
                </div>
                <div class="form-group">
                  <label>Monitor Link</label>
                  <input type="text" class="form-control" name="MonitorLink" value="{{ laptop.MonitorLink }}">
                </div>

                <div class="form-group">
                  <label>Cooler</label>
                  <input type="text" class="form-control" name="Cooler" value="{{ laptop.Cooler }}">
                </div>
                <div class="form-group">
                  <label>Cooler Link</label>
                  <input type="text" class="form-control" name="CoolerLink" value="{{ laptop.CoolerLink }}">
                </div>

                <div class="form-group">
                  <label>PSU</label>
                  <input type="text" class="form-control" name="PSU" value="{{ laptop.PSU }}">
                </div>
                <div class="form-group">
                  <label>PSU Link</label>
                  <input type="text" class="form-control" name="PSULink" value="{{ laptop.PSULink }}">
                </div>

                <div class="form-group">
                  <label>Storage</label>
                  <input type="text" class="form-control" name="Storage" value="{{ laptop.Storage }}">
                </div>
                <div class="form-group">
                  <label>Storage Link</label>
                  <input type="text" class="form-control" name="StorageLink" value="{{ laptop.StorageLink }}">
                </div>

                <div class="form-group">
                  <label>RAM</label>
                  <input type="text" class="form-control" name="RAM" value="{{ laptop.RAM }}">
                </div>
                <div class="form-group">
                  <label>RAM Link</label>
                  <input type="text" class="form-control" name="RAMLink" value="{{ laptop.RAMLink }}">
                </div>

                <div class="form-group">
                  <label>Motherboard</label>
                  <input type="text" class="form-control" name="Motherboard" value="{{ laptop.Motherboard }}">
                </div>
                <div class="form-group">
                  <label>Motherboard Link</label>
                  <input type="text" class="form-control" name="MotherboardLink" value="{{ laptop.MotherboardLink }}">
                </div>

                <div class="form-group">
                  <label>Company</label>
                  <input type="text" class="form-control" name="company" value="{{ laptop.company }}">
                </div>
                <div class="form-group">
                  <label>Battery</label>
                  <input type="text" class="form-control" name="Battary" value="{{ laptop.Battary }}">
                </div>
                <div class="form-group">
                  <label>Screen</label>
                  <input type="text" class="form-control" name="screen" value="{{ laptop.screen }}">
                </div>

              </div>

              <div class="modal-footer">
                <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
                <input type="submit" class="btn btn-success" value="Update">
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container-fluid">
      <div class="footer-in">
        <p class="mb-0">**TIKCOMPUTER**</p>
      </div>
    </div>
  </footer>
</div>

{% endblock %}
