{% extends 'base1.html'%}
{% load static%}

{% block content%}
<!--------main-content------------->
		   
		   <div class="main-content">
			  <div class="row">
			    
				<div class="col-md-12">
				<div class="table-wrapper">
    <div class="table-title">
      <div class="row">
        <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
          <h2 class="ml-lg-2">Manage GPU</h2>
        </div>
        <div class="col-sm-6 p-0 d-flex justify-content-lg-end justify-content-center">

          <!-- <a href="#deleteEmployeeModal" class="btn btn-danger" data-toggle="modal">
		  <i class="material-icons">&#xE15C;</i> <span>Delete</span></a> -->
        </div>
      </div>
    </div>
    <div class="modal-dialog">
      <div class="modal-content">
        <form  method="post" enctype="multipart/form-data">
          {% csrf_token %} 
          <div class="modal-header">
            <h4 class="modal-title">Edit GPU</h4>
            
          </div>

          <div class="modal-body">
            
            <div class="form-group">
              <label>name</label>
              <input type="text" class="form-control" name="name" value="{{GPU.name}}" required>
            </div>
            <div class="form-group">
              <label>price</label>
              <input type="text" class="form-control" name="price" value="{{GPU.price}}" required>
            </div>
            <div class="form-group">
              <label>count</label>
              <input type="text" class="form-control" name="count" value="{{GPU.count}}" required>
            </div>
            <div class="form-group">
              <label>link</label>
              <input type="text" class="form-control" name="link" value="{{GPU.link}}" required>
            </div>
            <div class="form-group">
              <label>interface_version</label>
              <input type="text" class="form-control" name="interface_version" value="{{GPU.interface_version}}" required>
            </div>
            <div class="form-group">
              <label>power_draw</label>
              <input type="text" class="form-control" name="power_draw" value="{{GPU.power_draw}}" required>
            </div>
            <div class="form-group">
              <label>length_mm</label>
              <input type="text" class="form-control" name="length_mm" value="{{GPU.length_mm}}" required>
            </div>
            <div class="form-group">
              <label>required_psu_wattage</label>
              <input type="text" class="form-control" name="required_psu_wattage" value="{{GPU.required_psu_wattage}}" required>
            </div>
            <div class="form-group">
              <label>output_ports</label>
              <input type="text" class="form-control" name="output_ports" value="{{GPU.output_ports}}" required>
            </div>


            <div class="form-group">
              <label>type</label>
              <select name="type">
                <option value="{{GPU.type}}">{{GPU.type}}</option>
                <option value="Low">Low</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
              </select>
            </div>
            
          </div>
          <div class="modal-footer">
            <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
            <input type="submit" class="btn btn-success" value="Edite">
          </div>
        </form>
      </div>
    </div>

  </div>
</div>




				
		   
			  </div>
	 
			 
			 <!---footer---->
			 
			 
		</div>
		
		<footer class="footer">
			    <div class="container-fluid">
				  <div class="footer-in">
                    <p class="mb-0">**TIKCOMPUTER**</p>
                </div>
				</div>
			 </footer>
</div>
</div>

{% endblock %}
