{% extends 'base1.html' %}
{% load static %}

{% block content %}
<!-- Main content -->
<div class="main-content">
  <div class="row">
    <div class="col-md-12">
      <div class="table-wrapper">
        <div class="table-title">
          <div class="row">
            <div class="col-sm-6 p-0 d-flex justify-content-lg-start justify-content-center">
              <h2 class="ml-lg-2">Edit New Computer</h2>
            </div>
          </div>
        </div>

        <div class="modal-dialog">
          <div class="modal-content">
            <form method="post" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="modal-header">
                <h4 class="modal-title">Edit Computer</h4>
              </div>

              <div class="modal-body">
                <div class="form-group">
                  <label>Photo</label>
                  <input type="file" class="form-control" name="photo">
                </div>
                <div class="form-group">
                  <label>Name</label>
                  <input type="text" class="form-control" name="name" value="{{ new_pc.name }}" required>
                </div>
                <div class="form-group">
                  <label>Count</label>
                  <input type="number" class="form-control" name="count" value="{{ new_pc.count }}" required>
                </div>
                                <div class="form-group">
                  <label>price</label>
                  <input type="number" class="form-control" name="price" value="{{ new_pc.price }}" required>
                </div>
                <div class="form-group">
                  <label>Type</label>
                  <input type="text" class="form-control" name="type" value="{{ new_pc.type }}" required>
                </div>
                <div class="form-group">
                  <label>CPU</label>
                  <input type="text" class="form-control" name="CPU" value="{{ new_pc.CPU }}">
                  <input type="url" class="form-control mt-1" name="CPULink" placeholder="CPU Link" value="{{ new_pc.CPULink }}">
                </div>
                <div class="form-group">
                  <label>GPU</label>
                  <input type="text" class="form-control" name="GPU" value="{{ new_pc.GPU }}">
                  <input type="url" class="form-control mt-1" name="GPULink" placeholder="GPU Link" value="{{ new_pc.GPULink }}">
                </div>
                <div class="form-group">
                  <label>Monitor</label>
                  <input type="text" class="form-control" name="Monitor" value="{{ new_pc.Monitor }}">
                  <input type="url" class="form-control mt-1" name="MonitorLink" placeholder="Monitor Link" value="{{ new_pc.MonitorLink }}">
                </div>
                <div class="form-group">
                  <label>Cooler</label>
                  <input type="text" class="form-control" name="Cooler" value="{{ new_pc.Cooler }}">
                  <input type="url" class="form-control mt-1" name="CoolerLink" placeholder="Cooler Link" value="{{ new_pc.CoolerLink }}">
                </div>
                <div class="form-group">
                  <label>PSU</label>
                  <input type="text" class="form-control" name="PSU" value="{{ new_pc.PSU }}">
                  <input type="url" class="form-control mt-1" name="PSULink" placeholder="PSU Link" value="{{ new_pc.PSULink }}">
                </div>
                <div class="form-group">
                  <label>Storage</label>
                  <input type="text" class="form-control" name="Storage" value="{{ new_pc.Storage }}">
                  <input type="url" class="form-control mt-1" name="StorageLink" placeholder="Storage Link" value="{{ new_pc.StorageLink }}">
                </div>
                <div class="form-group">
                  <label>RAM</label>
                  <input type="text" class="form-control" name="RAM" value="{{ new_pc.RAM }}">
                  <input type="url" class="form-control mt-1" name="RAMLink" placeholder="RAM Link" value="{{ new_pc.RAMLink }}">
                </div>
                <div class="form-group">
                  <label>Motherboard</label>
                  <input type="text" class="form-control" name="Motherboard" value="{{ new_pc.Motherboard }}">
                  <input type="url" class="form-control mt-1" name="MotherboardLink" placeholder="Motherboard Link" value="{{ new_pc.MotherboardLink }}">
                </div>
                <div class="form-group">
                  <label>Company</label>
                  <input type="text" class="form-control" name="company" value="{{ new_pc.company }}">
                </div>
              </div>

              <div class="modal-footer">
                <input type="button" class="btn btn-default" data-dismiss="modal" value="Cancel">
                <input type="submit" class="btn btn-success" value="Edit">
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container-fluid">
      <div class="footer-in">
        <p class="mb-0">**TIKCOMPUTER**</p>
      </div>
    </div>
  </footer>
</div>
{% endblock %}
