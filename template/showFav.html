<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Favourite </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .rating-stars {
      color: #ffc107;
      font-size: 1.2rem;
    }
    .user-photo {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
    }
    .review-card {
      border-bottom: 1px solid #ddd;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">

  <!-- Product Rating Summary -->
  <div class="text-center mb-5">
    <h2>{{tenant}} Favourite</h2>
    <!-- <div class="rating-stars fs-3">
                  {% for i in "12345" %}
              {% if forloop.counter <= sco %}
                ★
              {% else %}
                ☆
              {% endif %}
            {% endfor %}
            ({{ sco }})
    </div> -->
    <p class="text-muted">Based on {{Rcou}} Favourite</p>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
    <button>{% if test %} - Not Favourite {% else %} ➕ Add Favourite

      {% endif %}
    </button></form>
  </div>

  <!-- Reviews List -->
  <div class="bg-white p-4 rounded shadow-sm">

    <div class="bg-white p-4 rounded shadow-sm">
    {% for rating in Allfav %}
      <div class="review-card d-flex align-items-start">
        <img src="{{rating.HisUser2.person.photo.url}}" class="user-photo me-3" alt="User Photo" />
        <div>
          <h6 class="mb-0">{{ rating.HisUser2.first_name }} {{ rating.HisUser2.last_name }}</h6>
          
          <small class="text-muted">{{ rating.Date }}</small>
        </div>
      </div>
    {% empty %}
      <p class="text-center text-muted">No Favourite yet.</p>
    {% endfor %}
  </div>
</div>

<a href="{% url 'test'%}">Back</a>
    <!-- Add more static reviews here if needed -->

  </div>
</div>

<!-- Add Rating Modal -->
 
<div class="modal fade" id="addRatingModal" tabindex="-1" aria-labelledby="addRatingLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content rounded-4">
      <div class="modal-header">
        <h5 class="modal-title" id="addRatingLabel">Add Your Rating</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

         <form method="post" enctype="multipart/form-data">
        {% csrf_token %} 
        <div class="modal-body">
          <!-- Star Rating -->
          <div class="mb-3">
            <label class="form-label">Your Rating:</label><br>
            <div class="text-warning fs-4">
              <input type="radio" name="stars" value="1"> ★☆☆☆☆<br>
              <input type="radio" name="stars" value="2"> ★★☆☆☆<br>
              <input type="radio" name="stars" value="3"> ★★★☆☆<br>
              <input type="radio" name="stars" value="4"> ★★★★☆<br>
              <input type="radio" name="stars" value="5"> ★★★★★
            </div>
          </div>

          <!-- Name -->
         

          <!-- Comment -->
          <div class="mb-3">
            <label class="form-label">Your Review:</label>
            <textarea name="ReviewC" class="form-control" rows="3" required></textarea>
          </div>

        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success">Submit</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
