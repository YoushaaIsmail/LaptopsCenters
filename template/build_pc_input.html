<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Build a Computer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Select Your Budget and Performance Level</h1>

    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="budget" class="form-label">Total Budget (in USD):</label>
            <input type="number" step="0.01" class="form-control" id="budget" name="budget" required min="100" max="10000">
        </div>

        <div class="mb-3">
            <label for="performance" class="form-label">Desired Performance Level:</label>
            <select class="form-select" id="performance" name="performance" required>
                <option value="Low">Light</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Build My PC</button>
    </form>
</div>
</body>
</html>
