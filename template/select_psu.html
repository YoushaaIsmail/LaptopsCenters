<!DOCTYPE html>
<html>
<head>
    <title>Select PSU</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #b2ceeb !important;">
<div class="container mt-5">
    <h2 class="mb-4">Select PSU</h2>
    <p>Min Wattage Required: {{ min_wattage }} W</p>

    <form method="post">
        {% csrf_token %}
        <div class="row">
            {% for psu in psus %}
                <div class="col-md-4">
                    <div class="card mb-3 shadow-sm">
                        <div class="card-body">
                           <a href="{{psu.link}}"> <h5 class="card-title">{{ psu.name }}</h5></a>
                            <p class="card-text">
                                Wattage: {{ psu.wattage }} W<br>
                                Efficiency: {{ psu.efficiency_rating }}
                            </p>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="psu" value="{{ psu.id }}" id="psu{{ psu.id }}" required>
                                <label class="form-check-label" for="psu{{ psu.id }}">
                                    Choose this PSU
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Next</button>
    </form>
</div>
</body>
</html>
